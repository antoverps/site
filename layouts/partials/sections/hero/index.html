{{ if .Site.Params.hero.enable }}
<section id="hero" class="antover-hero">
  <div class="container">
    <div class="antover-hero-grid">

      <div class="antover-hero-copy">
        <div class="antover-hero-logos" aria-label="Instituições e grupos vinculados">
          <div class="antover-hero-logo antover-hero-logo-left">
            <img src="{{ "static/images/gpee.svg" | relURL }}" alt="GPEE">
          </div>
          <div class="antover-hero-logo antover-hero-logo-center">
            <img src="{{ "static/images/cenpes.png" | relURL }}" alt="CENPES">
          </div>
          <div class="antover-hero-logo antover-hero-logo-right">
            <img src="{{ "static/images/ufcat.png" | relURL }}" alt="UFCAT">
          </div>
        </div>

        <h1 style="font-size:2rem !important; line-height:1.08 !important; white-space:nowrap !important; max-width:none !important;">{{ .Site.Params.hero.title }}</h1>

        <p class="antover-hero-tagline">
          {{ .Site.Params.hero.subtitle }}
        </p>

        <div class="antover-hero-actions">
          <a href="#projects" class="antover-btn antover-btn-primary">
            Conheça os projetos
          </a>
          <a href="#contact" class="antover-btn antover-btn-secondary">
            Dados para contato
          </a>
        </div>

        <div class="antover-social-row" aria-label="Contatos e perfis profissionais">
          <a href="mailto:antoverps@ufcat.edu.br" title="E-mail" aria-label="E-mail">
            <img src="{{ "icons-academic/email.svg" | relURL }}" alt="E-mail">
          </a>

          <a href="https://github.com/antoverps" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
            <img src="{{ "icons-academic/github.svg" | relURL }}" alt="GitHub">
          </a>

          <a href="https://www.instagram.com/antoverps/" target="_blank" rel="noopener" title="Instagram" aria-label="Instagram">
            <img src="{{ "icons-academic/instagram.svg" | relURL }}" alt="Instagram">
          </a>

          <a href="https://www.researchgate.net/profile/Antover-Sarmento" target="_blank" rel="noopener" title="ResearchGate" aria-label="ResearchGate">
            <img src="{{ "icons-academic/researchgate.svg" | relURL }}" alt="ResearchGate">
          </a>

          <a href="http://lattes.cnpq.br/4025685702530313" target="_blank" rel="noopener" title="Currículo Lattes" aria-label="Currículo Lattes">
            <img src="{{ "icons-academic/lattes.svg" | relURL }}" alt="Lattes">
          </a>

          <a href="https://orcid.org/0000-0002-8533-1575" target="_blank" rel="noopener" title="ORCID" aria-label="ORCID">
            <img src="{{ "icons-academic/orcid.svg" | relURL }}" alt="ORCID">
          </a>
        </div>
      </div>

      <div class="antover-hero-photo-column">
        <img
          src="{{ "images/sap-des.JPG" | relURL }}"
          alt="Prof. Antover Panazzolo Sarmento"
          class="antover-hero-photo">
      </div>

    </div>
  </div>
</section>

<style>
.antover-hero{
  min-height:72vh;
  display:flex;
  align-items:center;
  padding:5rem 0 4rem;
}

.antover-hero-grid{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);
  gap:4rem;
  align-items:center;
}

.antover-hero-copy h1{
  margin:0;
  max-width:none;
  font-size:clamp(1.55rem,2vw,2.05rem);
  line-height:1.08;
  letter-spacing:-.03em;
  font-weight:700;
  white-space:nowrap;
}

.antover-hero-tagline{
  margin:1.05rem 0 0;
  max-width:835px;
  font-size:clamp(1rem,1.45vw,1.28rem);
  line-height:1.48;
  font-weight:500;
  color:#587063;
  text-align:justify;
  text-justify:inter-word;
}


html.dark .antover-hero-tagline,
[data-bs-theme="dark"] .antover-hero-tagline{
  color:#8FA99A;
}

.antover-hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:.75rem;
  margin-top:2rem;
}

.antover-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:.72rem 1.18rem;
  border-radius:.55rem;
  font-weight:650;
  text-decoration:none!important;
  transition:transform .15s ease,filter .15s ease;
}

.antover-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.05);
}

.antover-btn-primary{
  background:#004725;
  border:1px solid #004725;
  color:#fff!important;
}

.antover-btn-secondary{
  background:transparent;
  border:1px solid currentColor;
  color:inherit!important;
}

.antover-social-row{
  margin-top:1.25rem;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.55rem;
}

.antover-social-row a{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(128,128,128,.32);
  border-radius:.65rem;
  overflow:hidden;
  color:inherit!important;
  background:rgba(128,128,128,.06);
  text-decoration:none!important;
  transition:transform .15s ease,border-color .15s ease;
}

.antover-social-row a:hover{
  transform:translateY(-2px);
  border-color:#67c58d;
}


.antover-social-row img{
  width:32px;
  height:32px;
  display:block;
  object-fit:contain;
}

.antover-hero-photo-column{
  display:flex;
  align-items:center;
  justify-content:center;
}

.antover-hero-photo{
  display:block;
  width:min(100%,390px);
  max-height:520px;
  object-fit:cover;
  object-position:center top;
  border-radius:1rem;
  box-shadow:0 20px 55px rgba(0,0,0,.22);
  border:1px solid rgba(128,128,128,.20);
}


@media(max-width:1180px) and (min-width:901px){
  .antover-hero-grid{
    grid-template-columns:minmax(0,1.45fr) minmax(280px,.55fr);
    gap:3rem;
  }
  .antover-hero-copy h1{
    font-size:clamp(1.45rem,1.9vw,1.9rem);
  }
  .antover-hero-tagline{
    font-size:clamp(.98rem,1.35vw,1.16rem);
    max-width:760px;
  }
}

@media(max-width:900px){
  .antover-hero{
    min-height:auto;
    padding:4rem 0 3rem;
  }
  .antover-hero-grid{
    grid-template-columns:1fr;
    gap:2.5rem;
  }
  .antover-hero-photo-column{
    justify-content:flex-start;
  }
  .antover-hero-photo{
    width:min(80vw,350px);
  }
}

@media(max-width:560px){
  .antover-hero-copy h1{
    font-size:1.75rem;
    white-space:normal;
  }
  .antover-hero-tagline{
    font-size:1.05rem;
    text-align:left;
  }
  .antover-hero-actions{
    flex-direction:column;
  }
  .antover-btn{
    width:100%;
  }
}

@media(max-width:900px){
  .antover-hero-copy h1{
    font-size:1.7rem !important;
    white-space:normal !important;
  }
}


.antover-hero-logos{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  align-items:center;
  gap:1.5rem;
  width:100%;
  max-width:820px;
  margin:0 0 1.55rem;
}
.antover-hero-logo{
  min-width:0;
  display:flex;
  align-items:center;
}
.antover-hero-logo-left{
  justify-content:flex-start;
}
.antover-hero-logo-center{
  justify-content:center;
}
.antover-hero-logo-right{
  justify-content:flex-end;
}
.antover-hero-logo img{
  display:block;
  max-width:100%;
  width:auto;
  height:auto;
  max-height:64px;
  object-fit:contain;
}
@media(max-width:900px){
  .antover-hero-logos{
    max-width:100%;
    gap:1rem;
    margin-bottom:1.25rem;
  }
  .antover-hero-logo img{
    max-height:52px;
  }
}
@media(max-width:560px){
  .antover-hero-logos{
    grid-template-columns:repeat(3,1fr);
    gap:.65rem;
  }
  .antover-hero-logo img{
    max-height:42px;
  }
}

</style>
{{ end }}
