<span class="hero-social-row">
  {{ range .Site.Params.hero.socialLinks.fontAwesomeIcons }}
  <span class="px-1">
    <a href="{{ .url }}" target="_blank" rel="noopener" class="btn social-icon" aria-label="Perfil ou contato externo">
      <i class="{{ .icon }}" aria-hidden="true"></i>
    </a>
  </span>
  {{ end }}

  {{ range .Site.Params.hero.socialLinks.customIcons }}
  <span class="px-1">
    <a href="{{ .url }}" target="_blank" rel="noopener" class="btn social-icon academic-social-icon" aria-label="Perfil acadêmico externo">
      <img src="{{ .icon | relURL }}" alt="">
    </a>
  </span>
  {{ end }}
</span>
