{{ if .Site.Params.about.enable | default false }}
<section id="about" class="py-5 antover-about-text-only">
  <div class="container">
    <div class="antover-about-wrap">
      <h3 class="text-center mb-4">{{ .Site.Params.about.title | default "Sobre" }}</h3>
      <div class="antover-about-content">
        {{ .Site.Params.about.content | markdownify }}
      </div>
    </div>
  </div>
</section>

<style>
.antover-about-wrap{
  max-width:980px;
  margin:0 auto;
}
.antover-about-content{
  font-size:1rem;
  line-height:1.72;
}
.antover-about-content p:last-child{
  margin-bottom:0;
}
</style>
{{ end }}
