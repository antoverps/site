{{ define "main" }}
<main class="container py-5 group-single-page">
  <a class="btn btn-sm btn-outline-secondary mb-4" href="{{ "/" | relURL }}#achievements">← Voltar a Grupos e Infraestrutura</a>

  <div class="row g-4 align-items-start">
    <div class="col-12 col-lg-4">
      <div class="group-single-image-wrap">
        {{ with .Params.image }}
        <img class="group-single-image" src="{{ . | relURL }}" alt="{{ $.Title }}">
        {{ end }}
      </div>
    </div>
    <div class="col-12 col-lg-8">
      {{ with .Params.tipo }}<div class="text-secondary mb-2">{{ . }}</div>{{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lead text-secondary">{{ . }}</p>{{ end }}

      {{ with .Params.tags }}
      <div class="group-single-tags mb-4">
        {{ range . }}<span>{{ . }}</span>{{ end }}
      </div>
      {{ end }}

      <div class="group-single-content">{{ .Content }}</div>
    </div>
  </div>
</main>

<style>
.group-single-image-wrap{min-height:250px;border-radius:.9rem;background:rgba(128,128,128,.06);display:flex;align-items:center;justify-content:center;padding:2rem}
.group-single-image{max-width:300px;max-height:210px;object-fit:contain}
.group-single-tags{display:flex;flex-wrap:wrap;gap:.4rem}
.group-single-tags span{font-size:.78rem;padding:.28rem .55rem;border:1px solid rgba(128,128,128,.3);border-radius:999px}
</style>
{{ end }}
