  about:
    enable: true
    title: Sobre
    image: ''
    content: 'Professor da Faculdade de Engenharia (FENG), do Mestrado em Engenharia Civil (PPGEC), do Mestrado e Doutorado em Engenharia de Materiais (PPGEM) e do Mestrado e Doutorado em Geografia da Universidade Federal de Catalão (UFCAT). Coordenador do Centro de Pesquisa em Engenharia Sustentável (CENPES-UFCAT), coordenador administrativo do Grupo de Pesquisa e Estudo em Engenharia (GPEE-UFCAT), coordenador do Escritório Escola e coordenador docente do grupo Engenheiros do Bem.


      Membro titular, representante da AMAT/UFCAT, na Câmara Técnica de Segurança de Barragens (CTSB) do Conselho Nacional de Recursos Hídricos (CNRH), vinculado ao Ministério da Integração e do Desenvolvimento Regional (MIDR).


      Membro suplente, representante da UFCAT, no Comitê da Bacia Hidrográfica dos Rios Corumbá, Veríssimo e porção goiana do Rio São Marcos (CBH CVSM).


      Doutor e Mestre em Recursos Hídricos e Ambientais pelo Programa de Pós-Graduação em Engenharia Agrícola da Universidade Federal de Viçosa (DEA-UFV) e graduado em Engenharia Agrícola pela Universidade Federal de Pelotas (FEA-UFPel).'
    skills:
      enable: false
  experience:
    enable: true
    title: Atuação e áreas de interesse
    items:
    - job: Prefeituras e Território
      company: Soluções aplicadas
      content: '- Planejamento urbano, drenagem e planos diretores.

        - Diagnóstico ambiental, recursos hídricos e uso e ocupação do solo.

        - Geotecnologias, VANTs, erosão, resíduos e apoio técnico à tomada de decisão.'
    - job: Indústrias e Mineração
      company: Soluções aplicadas
      content: '- Estudos ambientais integrados e conservação de solo e água.

        - Recuperação de áreas e valorização de resíduos e rejeitos.

        - Rotas tecnológicas, aproveitamento energético e construção sustentável.'
    - job: Órgãos e Inovação
      company: Soluções aplicadas
      content: '- Inteligência artificial, estatística, modelagem e automação.

        - Dashboards, aplicativos e sistemas de apoio à decisão.

        - Diagnósticos, análises independentes e capacitação técnica.'
    - job: Áreas de interesse
      company: Linhas transversais
      content: '- Recursos hídricos e ambientais.

        - Geotecnologias, VANTs e análise socioambiental.

        - Estatística e inteligência artificial.

        - Efluentes, resíduos sólidos e biodigestão.

        - Construção sustentável e aproveitamento de resíduos.

        - Análise de investimentos e apoio à decisão.'
