  customScripts: "<style>\n/* Hero mais compacto */\n#hero h1 {\n  font-size: clamp(2.15rem, 4.2vw, 3.55rem) !important;\n  line-height: 1.06 !important;\n  letter-spacing: -0.025em;\n}\n#hero h2,\n#hero .subtitle {\n  font-size: clamp(1.15rem, 2.15vw, 1.75rem) !important;\n  line-height: 1.35 !important;\n  max-width: 850px;\n}\n\n/* Projetos */\n.project-card-custom {\n  overflow: hidden;\n  border-radius: .75rem;\n  transition: transform .18s ease, box-shadow .18s ease;\n}\n.project-card-custom:hover {\n  transform: translateY(-3px);\n}\n.project-cover-custom {\n  width: 100%;\n  height: 190px;\n  object-fit: cover;\n}\n.project-status-active {\n  background: #004725 !important;\n  color: #fff !important;\n}\n.project-status-completed {\n  background: #5f6962 !important;\n  color: #fff !important;\n}\n.project-period-custom {\n  font-size: .82rem;\n  margin-left: .45rem;\n  opacity: .72;\n}\n.project-tags-custom {\n  display: flex;\n  flex-wrap: wrap;\n  gap: .35rem;\n}\n.project-tags-custom span {\n  display: inline-block;\n  padding: .22rem .48rem;\n  border-radius: 999px;\n  font-size: .72rem;\n  border: 1px solid rgba(128,128,128,.28);\n}\n.project-count-custom {\n  font-size: .85rem;\n  opacity: .68;\n}\n.projects-list-page {\n  min-height: 60vh;\n}\n\n/* Ícones acadêmicos no rodapé, ao lado de GitHub/Instagram (herdam o tamanho original) */\n.footer-extra-social {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  margin: 0 .3rem;\n  line-height: 1;\n  text-decoration: none !important;\n}\n.footer-extra-social:hover {\n  transform: translateY(-2px);\n}\n\n/* Crédito \"Tecnologia: Hugo · Tema-base: Hugo Profile\" menor, mantido no canto esquerdo */\n.footer-credit-custom {\n  font-size: .78rem !important;\n  opacity: .65;\n  text-align: left !important;\n  margin-left: 0 !important;\n}\n\n/* Grupos e Infraestrutura — ícone + card clicável */\n.achievement-icon {\n  margin-right: .45rem;\n  color: var(--primary-color, #004725);\n}\n.achievement-clickable {\n  cursor: pointer;\n  transition: transform .18s ease, box-shadow .18s ease;\n}\n.achievement-clickable:hover {\n  transform: translateY(-3px);\n  box-shadow: 0 12px 30px rgba(0,0,0,.14);\n}\n</style>\n\n<script>\ndocument.addEventListener(\"DOMContentLoaded\", function () {\n  // Segundo CTA do hero.\n  const heroButton = document.querySelector(\"#hero a.btn\");\n  if (heroButton && !document.querySelector(\"#hero .contact-cta\")) {\n    const contact = heroButton.cloneNode(false);\n    contact.textContent = \"Entrar em contato\";\n    contact.href = \"#contact\";\n    contact.classList.add(\"contact-cta\", \"ms-2\");\n    heroButton.parentElement.appendChild(contact);\n  }\n\n  // ===== Rodapé: ícones acadêmicos com o MESMO tamanho de GitHub/Instagram =====\n  const footer = document.querySelector(\"footer\");\n  if (footer) {\n    footer.querySelectorAll(\".footer-academic-links\").forEach(el => el.remove());\n\n    const github = footer.querySelector('a[href*=\"github.com/antoverps\"]');\n    const instagram = footer.querySelector('a[href*=\"instagram.com/antoverps\"]');\n    const template = github || instagram;\n\n    if (template && !footer.querySelector(\".footer-extra-social\")) {\n      const parent = template.parentElement;\n\n      const cloneSocialIcon = (href, label, iconClasses) => {\n        const clone = template.cloneNode(true);\n        clone.setAttribute(\"href\", href);\n        clone.setAttribute(\"target\", \"_blank\");\n        clone.setAttribute(\"rel\", \"noopener\");\n        clone.setAttribute(\"aria-label\", label);\n        clone.title = label;\n        clone.classList.add(\"footer-extra-social\");\n\n        // Ícone interno: preserva classes de tamanho (fa-lg, fa-xl, fa-2x, fa-fw...)\n        // e troca apenas o glifo/estilo da marca.\n        const icon = clone.querySelector(\"i\") || clone;\n        const sizeClasses = Array.from(icon.classList).filter(c =>\n          /^fa-(lg|xl|xs|sm|fw|[1-9]x)$/.test(c)\n        );\n        icon.className = \"\";\n        iconClasses.split(\" \").forEach(c => icon.classList.add(c));\n        sizeClasses.forEach(c => icon.classList.add(c));\n\n        return clone;\n      };\n\n      const extras = [\n        cloneSocialIcon(\"https://www.researchgate.net/profile/Antover-Sarmento\", \"ResearchGate\", \"fab fa-researchgate\"),\n        cloneSocialIcon(\"http://lattes.cnpq.br/4025685702530313\", \"Currículo Lattes\", \"fas fa-id-card\"),\n        cloneSocialIcon(\"https://orcid.org/0000-0002-8533-1575\", \"ORCID\", \"fab fa-orcid\")\n      ];\n\n      // Ordem final: ResearchGate · Lattes · ORCID · GitHub · Instagram.\n      extras.forEach(link => parent.insertBefore(link, template));\n    }\n\n    // Crédito do tema — menor, mantido no canto esquerdo.\n    const candidates = Array.from(footer.querySelectorAll(\"div,p,span\"));\n    const credit = candidates.find(el =>\n      el.textContent &&\n      (el.textContent.includes(\"Made with\") || el.textContent.includes(\"Tecnologia:\")) &&\n      !el.classList.contains(\"footer-academic-links\")\n    );\n    if (credit) {\n      credit.innerHTML =\n        'Tecnologia: <a href=\"https://gohugo.io/\" target=\"_blank\" rel=\"noopener\">Hugo</a> · ' +\n        'Tema-base: <a href=\"https://github.com/gurusabarish/hugo-profile\" target=\"_blank\" rel=\"noopener\">Hugo Profile</a>';\n      credit.classList.add(\"footer-credit-custom\");\n    }\n  }\n\n  // ===== Grupos e Infraestrutura: ícone + card clicável para cada item =====\n  const achievementData = {\n    \"CENPES\": { icon: \"fas fa-flask\", url: \"/grupos/cenpes/\" },\n    \"LAIMS\": { icon: \"fas fa-microchip\", url: \"/grupos/laims/\" },\n    \"GPEE\": { icon: \"fas fa-users\", url: \"/grupos/gpee/\" },\n    \"Engenheiros do Bem\": { icon: \"fas fa-hand-holding-heart\", url: \"/grupos/engenheiros-do-bem/\" }\n  };\n\n  const achievementsSection =\n    document.querySelector(\"#achievements\") ||\n    Array.from(document.querySelectorAll(\"section\")).find(\n      s => s.textContent && s.textContent.includes(\"Grupos e Infraestrutura\")\n    );\n\n  if (achievementsSection) {\n    achievementsSection.querySelectorAll(\"h1, h2, h3, h4, h5\").forEach(heading => {\n      const title = heading.textContent.trim();\n      const data = achievementData[title];\n      if (!data || heading.dataset.linked === \"1\") return;\n      heading.dataset.linked = \"1\";\n\n      if (!heading.querySelector(\".achievement-icon\")) {\n        const icon = document.createElement(\"i\");\n        icon.className = data.icon + \" achievement-icon\";\n        icon.setAttribute(\"aria-hidden\", \"true\");\n        heading.prepend(icon);\n      }\n\n      let card = heading.parentElement;\n      for (let i = 0; i < 5 && card && card !== achievementsSection; i++) {\n        if (card.className && /card|achievement/i.test(card.className)) break;\n        card = card.parentElement;\n      }\n      if (!card || card === achievementsSection) card = heading.parentElement;\n\n      card.classList.add(\"achievement-clickable\");\n      card.addEventListener(\"click\", function (e) {\n        if (e.target.closest(\"a\")) return;\n        window.location.href = data.url;\n      });\n    });\n  }\n\n  // ===== Move \"Contato\" para o final da página =====\n  const contactSection = document.querySelector(\"#contact\");\n  if (contactSection && contactSection.parentElement) {\n    contactSection.parentElement.appendChild(contactSection);\n  }\n});\n</script>"
