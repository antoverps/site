  customScripts: |-
    <style>
    /* Hero mais compacto e institucional */
    #hero h1 {
      font-size: clamp(2.15rem, 4.2vw, 3.55rem) !important;
      line-height: 1.06 !important;
      letter-spacing: -0.025em;
    }
    #hero h2,
    #hero .subtitle {
      font-size: clamp(1.15rem, 2.15vw, 1.75rem) !important;
      line-height: 1.35 !important;
      max-width: 850px;
    }
    #hero .content {
      font-size: 1rem !important;
    }
    #hero .btn {
      margin-top: .4rem;
    }
    #projects .all-projects-link {
      margin-top: 1.5rem;
      text-align: center;
    }
    #projects .all-projects-link a {
      display: inline-block;
      padding: .65rem 1.05rem;
      border: 1px solid var(--primary-color, #004725);
      border-radius: .45rem;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-academic-links {
      text-align: center;
      padding: .7rem 1rem 0;
      font-size: .9rem;
    }
    .footer-academic-links a {
      margin: 0 .35rem;
      text-decoration: none;
    }
    </style>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Segundo CTA do hero
      const heroButton = document.querySelector("#hero a.btn");
      if (heroButton && !document.querySelector("#hero .contact-cta")) {
        const contact = heroButton.cloneNode(false);
        contact.textContent = "Entrar em contato";
        contact.href = "#contact";
        contact.classList.add("contact-cta", "ms-2");
        heroButton.parentElement.appendChild(contact);
      }

      // CTA discreto para o acervo completo de projetos
      const projectContainer = document.querySelector("#projects .container");
      if (projectContainer && !document.querySelector("#projects .all-projects-link")) {
        const wrap = document.createElement("div");
        wrap.className = "all-projects-link";
        wrap.innerHTML = '<a href="projects/">Ver todos os projetos →</a>';
        projectContainer.appendChild(wrap);
      }

      // Links acadêmicos e profissionais no rodapé
      const footer = document.querySelector("footer");
      if (footer && !footer.querySelector(".footer-academic-links")) {
        const links = document.createElement("div");
        links.className = "footer-academic-links";
        links.innerHTML =
          '<a href="https://www.researchgate.net/profile/Antover-Sarmento" target="_blank" rel="noopener">ResearchGate</a> · ' +
          '<a href="http://lattes.cnpq.br/4025685702530313" target="_blank" rel="noopener">Lattes</a> · ' +
          '<a href="https://orcid.org/0000-0002-8533-1575" target="_blank" rel="noopener">ORCID</a> · ' +
          '<a href="https://github.com/antoverps" target="_blank" rel="noopener">GitHub</a> · ' +
          '<a href="https://www.instagram.com/antoverps/" target="_blank" rel="noopener">Instagram</a>';
        footer.appendChild(links);

        // Crédito do tema em formato mais profissional, sem coração.
        const candidates = Array.from(footer.querySelectorAll("div,p,span"));
        const credit = candidates.find(el =>
          el.textContent && el.textContent.includes("Made with") &&
          el.querySelector && el.querySelector('a[href*="hugo-profile"]')
        );
        if (credit) {
          credit.innerHTML =
            'Tecnologia: <a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a> · ' +
            'Tema-base: <a href="https://github.com/gurusabarish/hugo-profile" target="_blank" rel="noopener">Hugo Profile</a>';
        }
      }
    });
    </script>
