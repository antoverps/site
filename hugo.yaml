  about:
    enable: true
    title: "Sobre"
    image: "https://lh3.googleusercontent.com/sitesv/AG8ngQV6E0_lh6pql8MyXZNLgiMup_IpmYmt75fDWrYEE5jinNiTC61XhxAW93HCEZC8f_U8UBfn8IXdMEN0KqqIpXF2FijNkNiJ-7xnv1njWhjCMtaw8MmxT4FX1YHn7z3ups3rPXrtXcL3vaIXU1lPyQdy7d4TcVrUSQwqaIjLzVul4I6bm6qa_DXTIupTKtoCg3lX7_Z5oN6j_j5GXPCZSxuOutsK4tjp8MTaNovcwA4=w1280"
    content: |-
      Professor na Faculdade de Engenharia (FENG), no Mestrado em Engenharia Civil (PPGEC) e no Doutorado em Engenharia de Materiais (PPGEM) da Universidade Federal de Catalão. Diretor de Administração na Pró-Reitoria de Administração e Finanças (DADM-PROAF-UFCAT). Coordenador Administrativo do Grupo de Pesquisa e Estudo em Engenharia (GPEE-UFCAT). Coordenador do grupo Engenheiros do Bem.

      Membro titular e representante da UFCAT no Comitê de Bacias Hidrográficas dos Rios Corumbá, Veríssimo e porção Goiana do Rio São Marcos (CBH CVSM). Trabalha com ensino, pesquisa e extensão nos temas: modelagem de variáveis hidrológicas; construção sustentável; estatística, inteligência artificial; gestão de recursos hídricos e ambientais; biodigestão; utilização de drone na engenharia, análise de investimentos, tratamento e gestão de efluentes e resíduos sólidos.

      Doutor e Mestre em Recursos Hídricos e Ambientais pelo Programa de Pós-Graduação em Engenharia Agrícola da Universidade Federal de Viçosa (DEA-UFV) e graduado em Engenharia Agrícola na Universidade Federal de Pelotas (FEA-UFPel).
    skills:
      enable: false

  experience:
    enable: true
    title: "Atuação"
    items:
      - company: "Prefeituras"
        jobs:
          - name: "Território, infraestrutura e recursos ambientais"
            content: |-
              - Planos diretores, planejamento territorial e drenagem urbana.
              - Diagnóstico ambiental, uso e ocupação do solo e recursos hídricos.
              - Geotecnologias, VANTs, erosão, resíduos e apoio técnico à tomada de decisão.

      - company: "Indústrias e Mineração"
        jobs:
          - name: "Sustentabilidade e valorização de passivos"
            content: |-
              - Estudos ambientais integrados e conservação de solo e água.
              - Recuperação de áreas e valorização de resíduos e rejeitos.
              - Rotas tecnológicas para aproveitamento energético e construção sustentável.

      - company: "Órgãos e Inovação"
        jobs:
          - name: "Dados, inteligência artificial e suporte técnico"
            content: |-
              - Inteligência artificial, estatística e modelagem.
              - Dashboards, aplicativos e sistemas de apoio à decisão.
              - Diagnósticos, análises independentes e capacitação técnica.

