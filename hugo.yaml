    params:
      description: Ingeniería sostenible, recursos hídricos, diagnóstico ambiental, geotecnologías e inteligencia artificial aplicada.
      hero:
        subtitle: Enseñanza, investigación e innovación aplicadas a soluciones sostenibles en ingeniería.
      about:
        title: Sobre mí
        content: 'Profesor de la Facultad de Ingeniería (FENG), de la Maestría en Ingeniería Civil (PPGEC), de la Maestría y el Doctorado en Ingeniería de Materiales (PPGEM) y de la Maestría y el Doctorado en Geografía de la Universidad Federal de Catalão (UFCAT). Coordinador del Centro de Investigación en Ingeniería Sostenible (CENPES-UFCAT), coordinador administrativo del Grupo de Investigación y Estudio en Ingeniería (GPEE-UFCAT) y coordinador del Escritório Escola (oficina-escuela de ingeniería).


          Miembro titular, en representación de AMAT/UFCAT, de la Cámara Técnica de Seguridad de Presas (CTSB) del Consejo Nacional de Recursos Hídricos (CNRH) de Brasil, vinculado al Ministerio de Integración y Desarrollo Regional (MIDR).


          Miembro suplente, en representación de la UFCAT, del Comité de la Cuenca Hidrográfica de los ríos Corumbá, Veríssimo y la porción goiana del río São Marcos (CBH CVSM).


          Doctor y Magíster en Recursos Hídricos y Ambientales por el Programa de Posgrado en Ingeniería Agrícola de la Universidad Federal de Viçosa (DEA-UFV) e Ingeniero Agrícola por la Universidad Federal de Pelotas (FEA-UFPel).'
      experience:
        title: Actuación y áreas de interés
      achievements:
        title: Grupos e Infraestructura
      plataformas:
        title: Plataformas
        subtitle: Herramientas computacionales abiertas, desarrolladas con estudiantes y socios, para la enseñanza, la investigación y el diseño en ingeniería.
        items:
        - title: Coretec Tools
          content: Hub accesible de calculadoras de ingeniería civil y química, con teoría, ecuaciones y ejemplos junto a cada cálculo.
          image: /images/plataformas/coretec.png
          url: https://www.coretectools.com.br/
          host: coretectools.com.br
        - title: CONCRETA
          content: Inteligencia artificial del GPEE que estima la resistencia a compresión (fck) del concreto a partir de los datos de dosificación.
          image: /images/plataformas/concreta.svg
          url: https://concreta.streamlit.app/
          host: concreta.streamlit.app
        - title: Biodigestor
          content: Calculadora para dimensionar distintos modelos de biodigestores, con tutorial, teoría y parámetros estimados o personalizados.
          image: /images/plataformas/biodigestor.svg
          url: https://biodigestor.streamlit.app/
          host: biodigestor.streamlit.app
        - title: RainData
          content: Mapa y exploración de datos de 602 estaciones pluviométricas, con análisis hidrológicos a partir de las series de lluvia.
          image: /images/plataformas/raindata.svg
          url: https://raindata.streamlit.app/
          host: raindata.streamlit.app
      projects:
        title: Proyectos y Alianzas
      contact:
        title: Contacto
        content: "**Universidad Federal de Catalão (UFCAT)**  \nFacultad de Ingeniería — Bloque O  \nAv. Dr. Lamartine Pinto de Avelar, 1120  \nSetor Universitário — Catalão — GO — Brasil  \nCP 75.704-020\n\nPara proyectos, alianzas y contacto institucional:"
