  customScripts: "<style>\n/* Hero mais compacto */\n#hero h1 {\n  font-size: clamp(2.15rem, 4.2vw, 3.55rem) !important;\n  line-height: 1.06 !important;\n  letter-spacing: -0.025em;\n}\n#hero h2,\n#hero .subtitle {\n  font-size: clamp(1.15rem, 2.15vw, 1.75rem) !important;\n  line-height: 1.35 !important;\n  max-width: 850px;\n}\n\n/* Projetos */\n.project-card-custom {\n  overflow: hidden;\n  border-radius: .75rem;\n  transition: transform .18s ease, box-shadow .18s ease;\n}\n.project-card-custom:hover {\n  transform: translateY(-3px);\n}\n.project-cover-custom {\n  width: 100%;\n  height: 190px;\n  object-fit: cover;\n}\n.project-status-active {\n  background: #004725 !important;\n  color: #fff !important;\n}\n.project-status-completed {\n  background: #5f6962 !important;\n  color: #fff !important;\n}\n.project-period-custom {\n  font-size: .82rem;\n  margin-left: .45rem;\n  opacity: .72;\n}\n.project-tags-custom {\n  display: flex;\n  flex-wrap: wrap;\n  gap: .35rem;\n}\n.project-tags-custom\
    \ span {\n  display: inline-block;\n  padding: .22rem .48rem;\n  border-radius: 999px;\n  font-size: .72rem;\n  border: 1px solid rgba(128,128,128,.28);\n}\n.project-count-custom {\n  font-size: .85rem;\n  opacity: .68;\n}\n.projects-list-page {\n  min-height: 60vh;\n}\n\n/* Ícones acadêmicos no mesmo grupo de GitHub/Instagram */\n.footer-extra-social {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  margin: 0 .3rem;\n  font-size: 1.75rem;\n  line-height: 1;\n  text-decoration: none !important;\n}\n.footer-extra-social:hover {\n  transform: translateY(-2px);\n}\n</style>\n\n<script>\ndocument.addEventListener(\"DOMContentLoaded\", function () {\n  // Segundo CTA do hero.\n  const heroButton = document.querySelector(\"#hero a.btn\");\n  if (heroButton && !document.querySelector(\"#hero .contact-cta\")) {\n    const contact = heroButton.cloneNode(false);\n    contact.textContent = \"Entrar em contato\";\n    contact.href = \"#contact\";\n    contact.classList.add(\"\
    contact-cta\", \"ms-2\");\n    heroButton.parentElement.appendChild(contact);\n  }\n\n  const footer = document.querySelector(\"footer\");\n  if (!footer) return;\n\n  // Remove qualquer linha textual criada pela versão anterior.\n  footer.querySelectorAll(\".footer-academic-links\").forEach(el => el.remove());\n\n  // Localiza o grupo dos ícones já existentes.\n  const github = footer.querySelector('a[href*=\"github.com/antoverps\"]');\n  const instagram = footer.querySelector('a[href*=\"instagram.com/antoverps\"]');\n  const anchor = github || instagram;\n\n  if (anchor && !footer.querySelector(\".footer-extra-social\")) {\n    const parent = anchor.parentElement;\n\n    const makeIcon = (href, label, iconClass) => {\n      const a = document.createElement(\"a\");\n      a.href = href;\n      a.target = \"_blank\";\n      a.rel = \"noopener\";\n      a.className = \"footer-extra-social\";\n      a.setAttribute(\"aria-label\", label);\n      a.title = label;\n      a.innerHTML = '<i\
    \ class=\"' + iconClass + '\" aria-hidden=\"true\"></i>';\n      return a;\n    };\n\n    const extras = [\n      makeIcon(\"https://www.researchgate.net/profile/Antover-Sarmento\", \"ResearchGate\", \"fab fa-researchgate\"),\n      makeIcon(\"http://lattes.cnpq.br/4025685702530313\", \"Currículo Lattes\", \"fas fa-id-card\"),\n      makeIcon(\"https://orcid.org/0000-0002-8533-1575\", \"ORCID\", \"fab fa-orcid\")\n    ];\n\n    // Insere antes do GitHub para ficar: ResearchGate · Lattes · ORCID · GitHub · Instagram.\n    extras.forEach(link => parent.insertBefore(link, anchor));\n  }\n\n  // Crédito do tema, mantendo atribuição de forma institucional.\n  const candidates = Array.from(footer.querySelectorAll(\"div,p,span\"));\n  const credit = candidates.find(el =>\n    el.textContent &&\n    (el.textContent.includes(\"Made with\") || el.textContent.includes(\"Tecnologia:\")) &&\n    !el.classList.contains(\"footer-academic-links\")\n  );\n  if (credit) {\n    credit.innerHTML =\n   \
    \   'Tecnologia: <a href=\"https://gohugo.io/\" target=\"_blank\" rel=\"noopener\">Hugo</a> · ' +\n      'Tema-base: <a href=\"https://github.com/gurusabarish/hugo-profile\" target=\"_blank\" rel=\"noopener\">Hugo Profile</a>';\n  }\n});\n</script>"
