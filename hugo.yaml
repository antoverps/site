    params:
      description: Sustainable engineering, water resources, environmental assessment, geotechnologies and applied artificial intelligence.
      hero:
        subtitle: Teaching, research and innovation applied to sustainable engineering solutions.
      about:
        title: About
        content: 'Professor at the School of Engineering (FENG), the Master''s Program in Civil Engineering (PPGEC), the Master''s and Doctoral Programs in Materials Engineering (PPGEM) and the Master''s and Doctoral Programs in Geography at the Federal University of Catalão (UFCAT). Coordinator of the Sustainable Engineering Research Center (CENPES-UFCAT), administrative coordinator of the Engineering Research and Study Group (GPEE-UFCAT) and coordinator of the Escritório Escola (engineering practice office).


          Full member, representing AMAT/UFCAT, of the Technical Chamber on Dam Safety (CTSB) of Brazil''s National Water Resources Council (CNRH), under the Ministry of Integration and Regional Development (MIDR).


          Alternate member, representing UFCAT, of the River Basin Committee of the Corumbá, Veríssimo and Goiás portion of the São Marcos rivers (CBH CVSM).


          PhD and MSc in Water and Environmental Resources from the Graduate Program in Agricultural Engineering at the Federal University of Viçosa (DEA-UFV), and BEng in Agricultural Engineering from the Federal University of Pelotas (FEA-UFPel).'
      experience:
        title: Expertise and research interests
      achievements:
        title: Groups and Infrastructure
      plataformas:
        title: Platforms
        subtitle: Open computational tools, built with students and partners, for engineering teaching, research and design.
        items:
        - title: Coretec Tools
          content: Accessible hub of civil and chemical engineering calculators, with theory, equations and examples alongside each calculation.
          image: /images/plataformas/coretec.png
          url: https://www.coretectools.com.br/
          host: coretectools.com.br
        - title: CONCRETA
          content: GPEE's artificial intelligence that estimates concrete compressive strength (fck) from mix design data.
          image: /images/plataformas/concreta.svg
          url: https://concreta.streamlit.app/
          host: concreta.streamlit.app
        - title: Biodigestor
          content: Calculator for sizing different biodigester models, with tutorial, theory and estimated or custom parameters.
          image: /images/plataformas/biodigestor.svg
          url: https://biodigestor.streamlit.app/
          host: biodigestor.streamlit.app
        - title: RainData
          content: Map and data explorer for 602 rain gauge stations, with hydrological analyses from rainfall series.
          image: /images/plataformas/raindata.svg
          url: https://raindata.streamlit.app/
          host: raindata.streamlit.app
      projects:
        title: Projects and Partnerships
      contact:
        title: Contact
        content: "**Federal University of Catalão (UFCAT)**  \nSchool of Engineering — Building O  \nAv. Dr. Lamartine Pinto de Avelar, 1120  \nSetor Universitário — Catalão — GO — Brazil  \nZIP 75.704-020\n\nFor projects, partnerships and institutional contact:"
